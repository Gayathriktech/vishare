<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#eef5fc" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#070d1c" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViShare – Deploy trips, sync expenses</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef5fc;--grid:#d9e4f1;--card:#fff;--ink:#0d2238;--mute:#5d7287;--line:#d6e2ee;--field:#eaf3fc;--blue:#2f7fe0;--green:#3dbb6e;--grad:linear-gradient(90deg,#2f7fe0,#3dbb6e);--pos:#1f9d57;--neg:#d4503f;--glow:0 18px 40px -18px rgba(30,80,140,.35);--hd:rgba(238,245,252,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1c;--grid:#101c33;--card:#0e1a30;--ink:#e7f0fb;--mute:#8aa0ba;--line:#1e3556;--field:#0a1527;--pos:#4fe08e;--neg:#ff7b69;--glow:0 0 0 1px #1e3556,0 0 34px -10px rgba(61,187,110,.45);--hd:rgba(7,13,28,.88)}}
:root[data-theme="dark"]{--bg:#070d1c;--grid:#101c33;--card:#0e1a30;--ink:#e7f0fb;--mute:#8aa0ba;--line:#1e3556;--field:#0a1527;--pos:#4fe08e;--neg:#ff7b69;--glow:0 0 0 1px #1e3556,0 0 34px -10px rgba(61,187,110,.45);--hd:rgba(7,13,28,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.wm{font-family:Montserrat,Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--hd);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hi{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;cursor:pointer;margin-right:auto}
.wm{font-weight:700;font-size:21px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lk{display:flex;gap:22px;flex-wrap:wrap;overflow:visible}
.lk button{border:0;background:none;padding:8px 0;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap;position:relative}
.lk button.on{color:var(--blue)}.lk .dot{position:absolute;top:2px;right:-8px;width:8px;height:8px;border-radius:50%;background:var(--neg)}
.out{border:0;border-radius:10px;padding:10px 20px;font-size:12.5px;font-weight:700;letter-spacing:.12em;color:#06231a;background:linear-gradient(90deg,#3de0a0,#36c97c);box-shadow:0 8px 20px -8px rgba(61,224,160,.7)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--glow)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;color:#fff;background:var(--grad)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}.btn[disabled]{opacity:.55;cursor:default}
.fld{display:block;width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.mute{color:var(--mute)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--pos);border:1px solid var(--pos);border-radius:99px;padding:4px 12px;background:var(--field)}
.stat:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
h1.pg{font-size:32px;line-height:1.2;margin:14px 0 8px;max-width:640px}
h2.pg{font-size:26px;margin-bottom:6px}
.login{max-width:410px;margin:5vh auto 0;text-align:center;padding:0 16px}
.login h1{font-size:44px;font-weight:600;letter-spacing:-1px;margin:6px 0 20px}.login .card{text-align:left}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.soc button{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px 4px}
.div{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}.div:before,.div:after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--neg);font-size:13px;min-height:18px;margin:0 0 8px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin-top:20px}
.post{padding:0;overflow:hidden;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px}
.ring{padding:2px;border-radius:50%;background:var(--grad);display:inline-block;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ring .av{border:2px solid var(--card)}
.cover{height:96px;background:var(--grad);display:flex;align-items:end;padding:14px 18px;color:#fff}.cover b{font:700 20px Montserrat}
.pb{padding:14px 18px 18px;flex:1;display:flex;flex-direction:column;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{background:var(--field);border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:12.5px;font-weight:500}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}.sum .card{padding:16px}
.big{font:700 24px Montserrat}
.tabs{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 14px;font-weight:600;color:var(--mute);white-space:nowrap}.tabs button.on{background:var(--grad);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}.row .m{flex:1;min-width:150px}
.bar{height:8px;border-radius:9px;background:var(--field);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grad)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.seg label{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 12px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,127,224,.25)}.seg input{margin-right:6px}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.who label{display:flex;gap:6px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cols>.card{align-self:start}
#cl{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.msg{max-width:78%;background:var(--field);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff;border:0;border-radius:14px 14px 4px 14px}
.msg.plan{border:1px dashed var(--blue)}.mh{font-size:12px;opacity:.75;margin-bottom:2px}
.send{display:flex;gap:10px;margin-top:10px}.send .fld{margin:0}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:7;width:42px;height:78px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--glow);padding:6px;display:flex;align-items:flex-end}
.fab span{width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:15px;transition:transform .25s;transform:translateY(0)}
.fab.light span{transform:translateY(-38px)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:10;max-width:90vw}
.ov{position:fixed;inset:0;background:rgba(5,12,25,.6);display:grid;place-items:center;z-index:9;padding:16px}.md{width:100%;max-width:340px;text-align:center}
@media(max-width:700px){.form2,.cols,.seg{grid-template-columns:1fr}.login h1{font-size:38px}h1.pg{font-size:26px}.lk{order:3;width:100%;gap:18px}.hi{gap:8px 12px}}
@media (prefers-reduced-motion:reduce){.fab span{transition:none}}
.pf{border:0;background:none;padding:0;display:flex;border-radius:50%}label.mute{display:block;font-size:13px;margin-bottom:4px}textarea.fld{resize:vertical}
.tag{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:99px;padding:3px 10px;white-space:nowrap}.tag.a{background:var(--green);color:#06231a}.tag.m{background:var(--blue);color:#fff}.tag.p{background:var(--field);border:1px solid var(--line);color:var(--mute)}
.post.own{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.post.own .cover{background:linear-gradient(90deg,#3dbb6e,#2f7fe0)}.post.mem{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.chipb{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--mute)}.chipb.on{background:var(--grad);color:#fff;border-color:transparent}
.big-run{padding:26px;border-color:var(--green);background:linear-gradient(180deg,var(--card),var(--field))}
.cover{justify-content:space-between;align-items:flex-end;gap:10px}
.cshare{flex:none;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:7px 9px;display:flex;backdrop-filter:blur(4px)}
.lk .dot.cnt{width:auto;min-width:17px;height:17px;border-radius:99px;font-size:10px;font-weight:700;font-style:normal;color:#fff;display:grid;place-items:center;padding:0 4px;top:-1px;right:-16px;letter-spacing:0}
h1.pg.one{max-width:none;font-size:clamp(20px,3vw,32px);white-space:nowrap}.sub1{margin:0;white-space:nowrap}
@media(max-width:640px){h1.pg.one,.sub1{white-space:normal}}
.tabs{overflow:visible;flex-wrap:wrap}
.dashwrap{border:1px solid var(--green);border-radius:12px;padding:16px;margin-top:20px;background:linear-gradient(180deg,var(--card),var(--field));box-shadow:var(--glow)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}.dh h2{font:700 20px Montserrat}
.dash{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(0,3fr) auto;gap:16px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;background:var(--card);padding:16px;margin-top:10px}
.dsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}.ds{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}.ds b{font:700 17px Montserrat}.dact{display:flex;flex-direction:column;gap:8px}
.tw{overflow-x:auto}.lt{width:100%;border-collapse:collapse}.lt th{font-size:12px;text-align:left;color:var(--mute);padding:8px 8px 8px 0;white-space:nowrap}.lt td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
@media(max-width:860px){.dash{grid-template-columns:1fr}}
.dash{grid-template-columns:minmax(240px,1.3fr) minmax(0,2fr) auto}
@media(max-width:860px){.dash{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div>
<button class="fab" id="fab" onclick="toggleTheme()" aria-label="Switch light or dark theme"><span id="fi"></span></button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const LOGO=(w=44)=>`<svg width="${w}" height="${w}" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2f7fe0"/><stop offset="1" stop-color="#3dbb6e"/></linearGradient></defs><path d="M5 40V8h8l11 17L35 8h8v32h-8V22L24 38 13 22v18z" fill="url(#g)"/></svg>`;
const fmt=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let sb=null,uid=null,COL={},DM=[],NT=[],NOTIFIED=new Set(),PLAN={},SHR={},TOT={},TH=null,SH=(location.hash.match(/trip=([0-9a-f-]{36})/)||[])[1],READY=false,OFF=false,USERS={},TRIPS={},EXP={},PAY={},CHAT=[],subs={},chatUnsub=null,V={view:'explore',cur:null,tab:'ledger',mode:'in'},S={theme:null,in:false};
try{S={...S,...JSON.parse(localStorage.getItem('vs_s')||'{}')}}catch(e){}
const saveS=()=>{try{localStorage.setItem('vs_s',JSON.stringify(S))}catch(e){}};
const dark=()=>S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){S.theme?document.documentElement.dataset.theme=S.theme:delete document.documentElement.dataset.theme;$('#fab').classList.toggle('light',!dark());$('#fi').textContent=dark()?'☾':'☀'}
function toggleTheme(){S.theme=dark()?'light':'dark';saveS();applyTheme()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
async function W(p,ok){try{await p;if(ok)toast(ok);return true}catch(e){toast(e&&e.code==='not_granted'?'Write blocked. Ask the page owner for edit access.':'Database error. Try again.');return false}}
const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const nm=u=>(USERS[u]||{}).name||'Traveller';
const trips=()=>Object.values(TRIPS).sort((a,b)=>b.at-a.at);
const tr=()=>TRIPS[V.cur];
const isM=(t,u)=>(t.members||[]).some(m=>m.u===u);
const isA=(t,u)=>(t.admins||[]).includes(u);
const total=x=>x.type==='fixed'?x.amt*x.who.length:x.amt;

/* ledger maths */
function bal(t){const b={};(t.members||[]).forEach(m=>b[m.u]=0);
 (t.members||[]).forEach(m=>{if(m.fee&&m.u in b&&t.host in b){b[t.host]+=m.fee;b[m.u]-=m.fee}});
 (EXP[t.id]||[]).forEach(x=>{if(!(x.by in b))return;const w=x.who.filter(e=>e in b);if(!w.length)return;const each=x.type==='fixed'?x.amt:x.amt/w.length;w.forEach(e=>b[e]-=each);b[x.by]+=each*w.length});
 (PAY[t.id]||[]).forEach(p=>{if(p.from in b&&p.to in b){b[p.from]+=p.amt;b[p.to]-=p.amt}});return b}
function plan(b){const d=Object.entries(b).filter(([,v])=>v<-.5).map(([id,v])=>({id,v:-v})).sort((a,c)=>c.v-a.v),c=Object.entries(b).filter(([,v])=>v>.5).map(([id,v])=>({id,v})).sort((a,c)=>c.v-a.v),o=[];let i=0,j=0;
 while(i<d.length&&j<c.length){const x=Math.min(d[i].v,c[j].v);o.push({from:d[i].id,to:c[j].id,amt:Math.round(x*100)/100});d[i].v-=x;c[j].v-=x;if(d[i].v<.5)i++;if(c[j].v<.5)j++}return o}
const dues=u=>{const o=[];trips().forEach(t=>{if(isM(t,u))plan(bal(t)).filter(p=>p.from===u).forEach(p=>o.push({t,p}))});return o};


/* data sync */
function syncTrips(){trips().forEach(t=>{if(!isM(t,uid)||subs[t.id])return;subs[t.id]=1;
 db.collection('trips/'+t.id+'/exp').onSnapshot(s=>{EXP[t.id]=list(s);render()});
 db.collection('trips/'+t.id+'/pay').onSnapshot(s=>{PAY[t.id]=list(s);render()})})}
function openChat(id){if(chatUnsub)chatUnsub();CHAT=[];chatUnsub=null;if(!id)return;
 chatUnsub=db.collection('trips/'+id+'/chat').orderBy('at').limit(200).onSnapshot(s=>{CHAT=list(s);const c=$('#cl');if(c){c.innerHTML=chatHTML();c.scrollTop=c.scrollHeight}})}
const go=(v,id,tab)=>{V.view=v;V.cur=id||null;V.tab=tab||'ov';openChat(v==='trip'?id:null);render();scrollTo(0,0)};

/* auth */
function loginView(){const up=V.mode==='up';
 return `<div class="login">${LOGO()}<h1>ViShare</h1><div class="card"><h3 style="margin-bottom:14px">${up?'Create account':'Sign In'}</h3>
 ${up?'<input class="fld" id="nm" placeholder="Your name" autocomplete="name">':''}
 <input class="fld" id="em" type="email" placeholder="Email Address" autocomplete="email">
 <input class="fld" id="pw" type="password" placeholder="Password" autocomplete="${up?'new-password':'current-password'}">
 <p class="err" id="err"></p><button class="btn" style="width:100%" onclick="auth()">${up?'Create account':'Log In'}</button>
 <div class="div" style="margin:16px 0 0">Or connect with</div>
 <div class="soc"><button onclick="social('Google')">Google</button><button onclick="social('Facebook')">Facebook</button><button onclick="social('Apple')">Apple</button></div>
 <p style="text-align:center;margin:6px 0 0" class="mute">${up?'Have an account?':'New to ViShare?'} <a href="#" onclick="V.mode='${up?'in':'up'}';render();return false" style="color:var(--blue);font-weight:600">${up?'Sign In':'Create an Account'}</a></p></div>
 <p class="mute" style="font-size:13px;margin-top:14px">Secured by Supabase Auth. Passwords are encrypted and never visible to ViShare.</p></div>`}
async function auth(){const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,n=$('#nm')?$('#nm').value.trim():'',bad=m=>$('#err').textContent=m,p=USERS[uid];
 if(!/^\S+@\S+\.\S+$/.test(em))return bad('Enter a valid email address.');if(pw.length<6)return bad('Password needs at least 6 characters.');
 if(V.mode==='up'){if(p)return bad('An account already exists for this identity. Sign in instead.');if(!n)return bad('Enter your name.');if(!await W(db.doc('users/'+uid).set({name:n,email:em,at:Date.now()})))return}
 else{if(!p)return bad('No account found. Create an account first.');if(p.email!==em)return bad('Email does not match this account.')}
 S.in=true;saveS();render()}
async function social(pv){if(!USERS[uid]){const me=await user.me();if(!await W(db.doc('users/'+uid).set({name:me.name||pv+' user',email:(me.email||pv.toLowerCase()+'@viewer').toLowerCase(),at:Date.now()})))return}S.in=true;saveS();render()}
function logout(){S.in=false;saveS();go('explore')}

/* explore */
function exploreView(){const o=owed(uid),l=trips();
 return `<h1 class="pg" style="margin-top:0">Deploy your next trip with the right crew.</h1><p class="mute" style="max-width:600px;margin:0">Browse open trips, send an access request, and sync expenses once the admin approves.</p>
 ${o>0?`<div class="card" style="margin-top:18px;border-color:var(--neg)"><b class="neg">Outstanding dues: ${fmt(o)}</b><div class="mute">Clear them before requesting access to a new trip.</div><button class="btn sm" style="margin-top:10px" onclick="go('dues')">Clear dues</button></div>`:''}
 ${l.length?`<div class="feed">${l.map(post).join('')}</div>`:'<div class="card" style="margin-top:20px"><b>No trips deployed yet.</b><div class="mute">Be the first. Open Start Trip and publish one.</div></div>'}`}
function post(t){const left=t.seats-t.members.length,m=isM(t,uid),p=(t.req||[]).includes(uid),h=nm(t.host);
 const a=m?`<button class="btn sm" onclick="go('trip','${t.id}')">${isA(t,uid)?'Manage trip':'Open trip'}</button>`:p?`<button class="btn sm ghost" disabled>Pending admin approval</button>`:left<=0?`<button class="btn sm ghost" disabled>Capacity full</button>`:owed(uid)>0?`<button class="btn sm ghost" onclick="go('dues')">Clear dues to request</button>`:`<button class="btn sm" onclick="reqJoin('${t.id}')">Request access · ${fmt(t.fee)}</button>`;
 return `<article class="card post"><div class="ph"><span class="ring"><span class="av">${esc(h[0])}</span></span><div><b>${esc(h)}</b><div class="mute" style="font-size:13px">Trip admin</div></div></div>
 <div class="cover"><b>${esc(t.name)}</b></div><div class="pb"><div class="mute">${esc(t.dest)} · ${esc(t.date)}</div><p style="margin:8px 0 0">${esc(t.desc)}</p>

 <div class="full"><label class="mute" for="bf">Bill image ${V.edit?'(leave empty to keep the old one)':'(optional)'}</label><input class="fld" id="bf" type="file" accept="image/*"></div></div>
 <p class="mute" id="ht" style="margin:0 0 8px">Enter the price for one person. It is charged to each traveller selected.</p><div class="who">${t.members.map(m=>`<label><input type="checkbox" class="wc" value="${m.u}" checked>${esc(nm(m.u))}</label>`).join('')}</div><button class="btn" onclick="addExp()">Review and confirm</button></div>`}
function fillEdit(id){const t=tr(),x=(EXP[t.id]||[]).find(e=>e.id===id);if(!x||!$('#et'))return;$('#et').value=x.title;$('#ea').value=x.amt;$('#ec').value=x.cat;$('#pt').value=x.to||'';$('#pu').value=x.unpl?'unplanned':'planned';$('#pby').value=x.adv||'';
 document.querySelectorAll('[name=ty]').forEach(r=>r.checked=r.value===x.type);document.querySelectorAll('.wc').forEach(c=>c.checked=x.who.includes(c.value));hint();const b=document.querySelector('button[onclick="addExp()"]');if(b)b.textContent='Review and confirm changes'}
let PX=null;
function addExp(){const t=tr(),title=$('#et').value.trim(),amt=parseFloat($('#ea').value),to=$('#pt').value.trim(),who=[...document.querySelectorAll('.wc:checked')].map(c=>c.value);
 if(!title)return toast('Add a description');if(!(amt>0))return toast('Enter an amount above 0');if(!to)return toast('Enter whom you paid');if(!who.length)return toast('Pick who shares this cost');
 PX={t:t.id,file:$('#bf').files[0]||null,row:{title,amt,type:document.querySelector('[name=ty]:checked').value,cat:$('#ec').value,paid_to:to,who,plan_item:null,unplanned:$('#pu').value==='unplanned',advance_by:$('#pby').value||null}};confModal()}
function confModal(){const t=TRIPS[PX.t],r=PX.row;$('#modal').innerHTML=`<div class="ov"><div class="card" style="width:100%;max-width:460px;max-height:90vh;overflow:auto" role="dialog" aria-label="Confirm who pays"><h3>Confirm who pays</h3><p class="mute" style="margin:4px 0 10px;font-size:13px">${esc(r.title)} · paid to ${esc(r.paid_to)}${r.advance_by?' · advanced by '+esc(nm(r.advance_by))+' (visible to them and you only)':''}. Untick anyone who is not part of this payment.</p>${t.members.map(m=>`<label class="row" style="cursor:pointer"><input type="checkbox" class="cw" value="${m.u}" ${r.who.includes(m.u)?'checked':''} onchange="cwCalc()">${av(m.u)}<span class="m"><b>${esc(nm(m.u))}</b></span><b id="cw-${m.u}"></b></label>`).join('')}<div class="row"><div class="m"><b>Total paid</b></div><b id="cwt"></b></div><div style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" style="flex:1" onclick="closeM()">Back</button><button class="btn" style="flex:1" onclick="confirmExp()">Confirm and save</button></div></div></div>`;cwCalc()}
function cwCalc(){const r=PX.row,n=document.querySelectorAll('.cw:checked').length;document.querySelectorAll('.cw').forEach(c=>{const e=document.getElementById('cw-'+c.value);if(e)e.textContent=c.checked&&n?fmt(r.type==='fixed'?r.amt:r.amt/n):'Not involved'});$('#cwt').textContent=fmt(r.type==='fixed'?r.amt*n:r.amt)}
async function confirmExp(){const t=TRIPS[PX.t],ids=[...document.querySelectorAll('.cw:checked')].map(c=>c.value);if(!ids.length)return toast('Pick at least one person');
 try{const row={...PX.row,who:ids};if(PX.file)row.bill_path=await upBill(PX.file,t.id);const r=V.edit?await sb.from('expenses').update(row).eq('id',V.edit):await sb.from('expenses').insert({trip_id:t.id,paid_by:uid,...row});if(r.error)throw r.error;closeM();toast(V.edit?'Expense updated':'Expense saved');V.edit=null;V.tab='ledger';await loadAll()}catch(e){toast(e.message||'Could not save')}}
async function addPlan(){const t=tr(),ti=$('#ptl').value.trim(),a=parseFloat($('#pam').value);if(!ti)return toast('Enter the plan item');if(!(a>=0))return toast('Enter the planned amount');await W(sb.from('plan_items').insert({trip_id:t.id,title:ti,category:$('#pcg').value,amt:a}),'Plan item added',1)}
async function delPlan(id){if(!confirm('Remove this plan item?'))return;await W(sb.from('plan_items').delete().eq('id',id),'',1)}
async function editPlan(id){const x=(PLAN[V.cur]||[]).find(p=>p.id===id),v=prompt('Planned amount for '+x.title+' (₹)',x.amt);if(v===null)return;const f=parseFloat(v);if(!(f>=0))return toast('Enter a valid amount');await W(sb.from('plan_items').update({amt:f}).eq('id',id),'Plan updated',1)}
async function setAllDue(a){const t=tr();if(!confirm("Set every member's amount to "+fmt(a)+'?'))return;await W(sb.rpc('set_all_due',{p_trip:t.id,p_due:a}),'Amounts updated',1)}
async function setPhase(p){const t=tr(),m={ongoing:'Start the trip? The expenditure plan becomes the baseline and new costs outside it are marked unplanned.',completed:'Complete the trip? You can then send final statements from the Ledger tab.'}[p]||'Reopen this trip?';if(!confirm(m))return;await W(sb.from('trips').update({phase:p}).eq('id',t.id),'Trip is now '+p,1)}
async function reimburse(id){await W(sb.from('expenses').update({reimbursed:true}).eq('id',id),'Marked reimbursed',1)}
/* ===== CHANGE: dashboard without amounts, no Budget plan tab, Planned/Unplanned column ===== */
function dashRow(t){const rq=(t.req||[]).length,st=(l,v,c='')=>`<div class="ds"><span class="mute" style="font-size:12px">${l}</span><b class="${c}">${v}</b></div>`;
 return `<div class="dash"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font:700 19px Montserrat">${esc(t.name)}</b><button class="btn ghost sm" aria-label="Share trip" onclick="shareTrip('${t.id}')">${shi()}</button></div><div class="mute" style="margin:2px 0 8px">${esc(t.dest)} · ${esc(t.date)}</div>${phTag(t)}</div>
 <div class="dsg">${st('Crew',t.members.length+'/'+t.seats)}${st('Seats free',Math.max(0,t.seats-t.members.length))}${st('Join requests',rq,rq?'neg':'')}</div>
 <div class="dact"><button class="btn" onclick="go('trip','${t.id}')">Manage trip</button>${rq?`<button class="btn ghost sm" onclick="go('trip','${t.id}','ov')">Review ${rq} request${rq>1?'s':''}</button>`:''}</div></div>`}
function dashboard(l){const q=sum(l,t=>(t.req||[]).length);return `<section class="dashwrap" aria-label="Admin dashboard"><div class="dh"><h2>Admin dashboard</h2><span class="mute">${l.length} trip${l.length>1?'s':''} you run · ${q} join request${q==1?'':'s'}</span></div>${l.map(dashRow).join('')}</section>`}
function tripView(){const t=tr();if(!t||!isM(t,uid))return mineView();const ad=isA(t,uid),ph=t.phase||'planned',ex=EXP[t.id]||[],got=sum(COL[t.id]||[],c=>c.amt),spent=spentOf(t),due=dueOf(t,uid),pd=paidOf(t,uid),pend=sum(t.members,m=>pendOf(t,m.u)),
 today=sum(ex.filter(x=>new Date(x.at).toDateString()===new Date().toDateString()),total),unp=sum(ex.filter(x=>x.unpl),total),pln=sum(ex.filter(x=>!x.unpl),total),advDue=sum(ex.filter(x=>x.adv&&!x.reimb),total),
 card=(l,v,c='')=>`<div class="card"><span class="mute">${l}</span><div class="big ${c}">${v}</div></div>`,
 cards=ad?card('Collected',fmt(got))+card('Spent',fmt(spent))+card('In hand',fmt(got-spent))+card('Pending to collect',fmt(pend),pend>0?'neg':''):card('Trip spend so far',fmt(spent))+card('Your amount',fmt(due))+card('You paid',fmt(pd),'pos')+card('Your pending',fmt(Math.max(0,due-pd)),due>pd?'neg':''),
 cards2=card('Planned spend',fmt(pln))+card('Unplanned spend',fmt(unp),unp>0?'neg':'')+(ph==='ongoing'?card('Spent today',fmt(today)):'')+(advDue?card(ad?'Reimbursements due':'Admin owes you',fmt(advDue),'neg'):''),
 T=[['ov','Overview'],['ledger','Ledger'],['pay','Payments'],...(ad?[['add','Expense']]:[]),['crew','Crew'],['plan','Itinerary'],['chat','Chat']],
 tabs=T.map(([k,l])=>`<button class="${V.tab===k?'on':''}" onclick="V.tab='${k}';render()">${l}</button>`).join(''),
 pb=ad?(ph==='planned'?'<button class="btn sm" onclick="setPhase(\'ongoing\')">Start trip</button>':ph==='ongoing'?'<button class="btn sm" onclick="setPhase(\'completed\')">Complete trip</button>':'<button class="btn ghost sm" onclick="setPhase(\'ongoing\')">Reopen trip</button>'):'';let body;
 if(V.tab==='ledger')body=ledgerTab(t,ad);else if(V.tab==='add'&&ad)body=addTab(t,ph);else{const o=tripViewOld();body=o.slice(o.indexOf('</div>',o.indexOf('<div class="tabs">'))+6)}
 return `<button class="btn ghost sm" onclick="go('mine')">← My trips</button><div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap"><h2 class="pg" style="margin:0">${esc(t.name)}</h2><button class="btn ghost sm" aria-label="Share trip" onclick="shareTrip('${t.id}')">${shi()}</button>${phTag(t)}${pb}</div><span class="mute">${esc(t.dest)} · ${esc(t.date)} </span><span class="chip">${ad?'ADMIN':'MEMBER'}</span><div class="sum">${cards}</div><div class="sum">${cards2}</div>${ad?reqCard(t):''}<div class="tabs">${tabs}</div>${body}`}
function addTab(t,ph){return `<div class="card"><h3 style="margin-bottom:6px">${V.edit?'Edit expense':'Add expense'} ${phTag(t)}</h3><p class="mute" style="margin:0 0 12px;font-size:13px">Mark each expense as Planned or Unplanned. The admin enters every amount.</p>
 <div class="seg"><label><input type="radio" name="ty" value="fixed" checked onchange="hint()"><b>Fixed amount</b><div class="mute" style="font-size:13px">Same price per person, e.g. train ticket</div></label><label><input type="radio" name="ty" value="split" onchange="hint()"><b>Split amount</b><div class="mute" style="font-size:13px">One total shared, e.g. food, stay</div></label></div>
 <div class="form2"><input class="fld full" id="et" placeholder="What was paid for? e.g. Train tickets"><div><label class="mute" for="ea">Amount (₹)</label><input class="fld" id="ea" type="number" min="0" step="0.01"></div><div><label class="mute" for="ec">Category</label><select class="fld" id="ec">${CATS}</select></div>
 <div><label class="mute" for="pt">Paid to (whom)</label><input class="fld" id="pt" placeholder="e.g. IRCTC, Hotel Tea Valley"></div><div><label class="mute" for="pln">Plan</label><select class="fld" id="pln"><option value="planned" ${ph==='ongoing'?'':'selected'}>Planned</option><option value="unplanned" ${ph==='ongoing'?'selected':''}>Unplanned</option></select></div>
 <div class="full"><label class="mute" for="pby">Paid by whom</label><select class="fld" id="pby"><option value="">Trip pool (paid by admin)</option>${t.members.filter(m=>m.u!==uid).map(m=>`<option value="${m.u}">Advanced by ${esc(nm(m.u))} (own pocket)</option>`).join('')}</select><div class="mute" style="font-size:12px;margin-top:-6px">For an unexpected cost a member paid. Only that member and you can see this entry.</div></div>
 <div class="full"><label class="mute" for="bf">Bill image ${V.edit?'(leave empty to keep the old one)':'(optional)'}</label><input class="fld" id="bf" type="file" accept="image/*"></div></div>
 <p class="mute" id="ht" style="margin:0 0 8px">Enter the price for one person. It is charged to each traveller selected.</p><div class="who">${t.members.map(m=>`<label><input type="checkbox" class="wc" value="${m.u}" checked>${esc(nm(m.u))}</label>`).join('')}</div><button class="btn" onclick="addExp()">Review and confirm</button></div>`}
function fillEdit(id){const t=tr(),x=(EXP[t.id]||[]).find(e=>e.id===id);if(!x||!$('#et'))return;$('#et').value=x.title;$('#ea').value=x.amt;$('#ec').value=x.cat;$('#pt').value=x.to||'';$('#pln').value=x.unpl?'unplanned':'planned';$('#pby').value=x.adv||'';
 document.querySelectorAll('[name=ty]').forEach(r=>r.checked=r.value===x.type);document.querySelectorAll('.wc').forEach(c=>c.checked=x.who.includes(c.value));hint();const b=document.querySelector('button[onclick="addExp()"]');if(b)b.textContent='Review and confirm changes'}
function addExp(){const t=tr(),title=$('#et').value.trim(),amt=parseFloat($('#ea').value),to=$('#pt').value.trim(),who=[...document.querySelectorAll('.wc:checked')].map(c=>c.value);
 if(!title)return toast('Add a description');if(!(amt>0))return toast('Enter an amount above 0');if(!to)return toast('Enter whom you paid');if(!who.length)return toast('Pick who shares this cost');
 PX={t:t.id,file:$('#bf').files[0]||null,row:{title,amt,type:document.querySelector('[name=ty]:checked').value,cat:$('#ec').value,paid_to:to,who,plan_item:null,unplanned:$('#pln').value==='unplanned',advance_by:$('#pby').value||null}};confModal()}


function bnav(){const v=V.view,n=unreadN(),on=k=>(v===k||(k==='mine'&&v==='trip'))?'on':'',ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
 return `<nav class="bnav" aria-label="Main"><button class="${on('explore')}" onclick="go('explore')">${ic('<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>')}Explore</button><button class="${on('mine')}" onclick="go('mine')">${ic('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>')}My trips</button><button onclick="go('new')" aria-label="Start trip"><span class="plus">${ic('<path d="M12 5v14M5 12h14"/>')}</span></button><button class="${on('inbox')}" onclick="go('inbox')">${ic('<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>')}Inbox${n?`<span class="bd">${n}</span>`:''}</button><button class="${on('profile')}" onclick="go('profile')">${av(uid,26)}Profile</button></nav>`}
function profileView(){return profileViewOld()+`<div class="only-m" style="margin-top:20px"><button class="btn ghost" style="width:100%" onclick="go('dues')">Payments due</button><button class="btn" style="width:100%;margin-top:10px" onclick="logout()">Log out</button></div>`}
function mineView(){return mineViewOld().replace('</h2>','</h2><div class="only-m" style="margin:6px 0 4px"><button class="btn ghost sm" onclick="go(\'dues\')">Payments due</button></div>')}
</script>
